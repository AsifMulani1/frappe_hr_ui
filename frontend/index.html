<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/frappe/images/frappe-favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frappe HR</title>
  </head>
  <body class="antialiased bg-surface-gray-1">
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      window.csrf_token = "{{ csrf_token }}"
      window.site_name = "{{ site_name }}"
      if (!window.frappe) window.frappe = {}
      frappe.boot = {{ boot }}
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
